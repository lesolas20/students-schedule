[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.11.2" ]

[project]
name = "frontend-telegram"
version = "1.0.0"
description = ""
readme = "README.md"
requires-python = ">=3.14"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "aiogram>=3.30.0",
  "babel>=2.18.0",
  "dotenv>=0.9.9",
  "pillow>=12.3.0",
  "psycopg[binary]>=3.3.4",
  "students-schedule==0.2",
  "utils==0.2",
]

[tool.uv]
sources.students-schedule = { path = "../../library/students-schedule" }
sources.utils = { path = "../../library/utils" }

[tool.ruff]
extend = "../../pyproject.toml"
lint.isort.known-first-party = [ "students_schedule", "utils" ]
