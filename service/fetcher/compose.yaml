name: students-schedule

services:
  fetcher:
    container_name: students-schedule-fetcher
    build:
      dockerfile: Containerfile
      context: .
      additional_contexts:
        service: ../../service
        library: ../../library
    environment:
      TZ: $TIMEZONE
      TIMEZONE: $TIMEZONE
      CONFIG_FILE: $CONFIG_FILE
      DB_USER: $DB_USER
      DB_PASSWORD: $DB_PASSWORD
      DB_HOST: $DB_HOST
      DB_PORT: $DB_PORT
      DB_NAME: $DB_NAME
    networks:
      - internal
      - public
    restart: unless-stopped

networks:
  internal:
    name: students-schedule-internal
    external: true
  public:
    driver: bridge
