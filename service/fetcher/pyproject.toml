[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.11.2" ]

[project]
name = "fetcher"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.14"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "dotenv>=0.9.9",
  "openpyxl>=3.1.5",
  "psycopg[binary]>=3.3.4",
  "requests>=2.34.2",
  "schedule>=1.2.2",
  "students-schedule==0.1",
  "utils==0.1",
]

[dependency-groups]
dev = [
  "types-openpyxl>=3.1.5.20260807",
  "types-requests>=2.33.0.20260712",
]

[tool.uv]
sources.students-schedule = { path = "../../library/students-schedule" }
sources.utils = { path = "../../library/utils" }

[tool.ruff]
extend = "../../pyproject.toml"
lint.isort.known-first-party = [ "students_schedule", "utils" ]
